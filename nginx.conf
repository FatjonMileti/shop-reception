daemon off;
events{}
http {
    include /etc/nginx/mime.types;
    client_max_body_size 3M;
    server {
       listen 80 default_server;
       listen [::]:80 default_server;

       root /usr/share/nginx/html;
       index index.html index.htm;
       client_max_body_size 3M;
       server_name _;
       location / {
          try_files $uri /index.html;
          client_max_body_size 3M;
       }
   }
}