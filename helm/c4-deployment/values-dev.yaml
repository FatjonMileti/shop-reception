#Number of replicas for the application
replicas: 1

#Application port
containerPort: 8085

#Start command
startCommand: yarn start

#GCP Secrets (provided by C4 DevOps Team)
secrets:
  'dex-ui-dev': ''

#Liveness & Readiness
readinessFailure: 10
readinessPeriod: 10
livenessFailure: 10
livenessPeriod: 10