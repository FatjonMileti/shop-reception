components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    ErrorDTO:
      type: object
      description: An error object disclosing details about the error cause.
      properties:
        code:
          type: string
          maxLength: 50
        message:
          type: string
          maxLength: 100
    WorkerList:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/Worker"
        page:
          $ref: "#/components/schemas/PagingMetadata"
    Worker:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 257
        fullName:
          type: string
          examples:
            - Razvan Ionescu
        jobTitle:
          type: string
          examples:
            - Sef echipa
        department:
          type: string
          description: The generic department of a worker
          examples:
            - PGC
        location:
          type: string
          description: The store name where the worker is assigned
          examples:
            - Hypermarche Alba Iulia
    EmployeeShift:
      type: object
      properties:
        workerId:
          type: integer
          format: int64
          examples:
            - 7290
        fullName:
          type: string
          examples:
            - Andrei Popescu
        shiftCategory:
          type: string
          description: The category of the worker depending on its working schedule.
          enum:
            - ON_SHIFT
            - OFF_SHIFT
            - COLLABORATOR
    EmployeeShiftList:
      type: array
      items:
        $ref: "#/components/schemas/EmployeeShift"
    AddContractor:
      type: object
      properties:
        firstName:
          type: string
          examples:
            - Andrei
        lastName:
          type: string
          examples:
            - Popescu
        middleName:
          type: string
          examples:
            - Marian
        employer:
          type: string
          examples:
            - Pepsico
    UpdateContractor:
      type: object
      properties:
        firstName:
          type: string
          examples:
            - Andrei
        lastName:
          type: string
          examples:
            - Popescu
        middleName:
          type: string
          examples:
            - Marian
        employer:
          type: string
          examples:
            - Pepsico
    TaskTemplate:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 2704
        name:
          type: string
          examples:
            - "Realimentare magazin PGC (stoc cascheta)"
        rayonsOrDepartment:
          type: string
          examples:
            - PGC
            - APLS
        recommendedStartHour:
          type: string
          format: time
          examples:
            - "06:00"
        recommendedEndHour:
          type: string
          format: time
          examples:
            - "08:30"
        frequency:
          type: string
          examples:
            - zilnic
            - ocazional
            - Lu
        standardProductivityValue:
          type: number
          examples:
            - 5.0
        measurementUnit:
          type: string
          examples:
            - "elemente/ora"
        priority:
          type: string
          enum:
            - "1 - Ridicat"
        workVolumeSource:
          type: string
          examples:
            - "Infolog marfa APLS"
            - "Manual"
        volumetryLocationCategory:
          type: string
          examples:
            - "Hyper - Maxi v1"
        isActive:
          type: boolean
    TaskTemplateList:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/TaskTemplate"
        page:
          $ref: "#/components/schemas/PagingMetadata"
    AddTaskTemplate:
      type: object
      properties:
        name:
          type: string
        estimatedStartHour:
          type: string
        estimatedEndHour:
          type: string
        frequency:
          type: string
        standardProductivityValue:
          type: number
        measurementUnitId:
          type: integer
        priorityId:
          type: integer
    UpdateTaskTemplate:
      type: object
      properties:
        name:
          type: string
        estimatedStartHour:
          type: string
        estimatedEndHour:
          type: string
        frequency:
          type: string
        standardProductivityValue:
          type: number
        measurementUnitId:
          type: integer
        priorityId:
          type: integer
        isActive:
          type: boolean
        comments:
          type: string
    FrequencyList:
      type: array
      items:
        type: string
    MeasurementUnitList:
      type: array
      items:
        $ref: "#/components/schemas/MeasurementUnit"
    MeasurementUnit:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
    PriorityList:
      type: array
      items:
        $ref: "#/components/schemas/Priority"
    Priority:
      type: object
      properties:
        id:
          type: integer
        value:
          type: string
        description:
          type: string
    Task:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 3964
        workerFullName:
          type: string
          examples:
            - Razvan Ionescu
        timeInterval:
          type: string
          examples:
            - "15:35 - 18:10"
            - "-"
        workload:
          type: string
          examples:
            - "40"
        timerStatus:
          type: string
          enum:
            - NOT_STARTED
            - IN_PROGRESS
            - FINISHED
        progressProportion:
          type: number
          description: The progress done on a task contribution, expressed as a ratio between elapsed time from starting the task and the estimated completion time. If the task contribution status is NOT_STARTED, return 0. If the status is IN_PROGRESS or FINISHED compute the ratio.
          examples:
            - 0.6
            - 0.0
            - 1.2
        comments:
          type: string
          examples:
            - "Aparatul a fost reparat."
    TaskList:
      type: array
      items:
        $ref: "#/components/schemas/Task"
    AddTask:
      type: object
      properties:
        workerId:
          type: integer
          format: int64
        taskTemplateId:
          type: integer
          format: int64
        workload:
          type: number
    UpdateTask:
      type: object
      properties:
        workload:
          type: number
    UpdateTimer:
      type: object
      properties:
        action:
          type: string
    AggregatedTasksSummaryList:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/AggregatedTasksSummary"
        page:
          $ref: "#/components/schemas/PagingMetadata"
    AggregatedTasksSummary:
      type: object
      properties:
        taskTemplateId:
          type: number
          format: int64
          description: "Needed by the FE for the React library"
          examples:
            - 12
        rayonsOrDepartment:
          type: string
          examples:
            - PGC
            - APLS
            - Peste, Macelarie
        taskName:
          type: string
          description: The task template name
          examples:
            - Realimentare magazin PGC (stoc cascheta)
        recommendedInterval:
          type: string
          description: "The task templateâ€™s recommended start and end hours"
          examples:
            - "06:00 - 09:00"
        allocatedWorkers:
          type: integer
          format: int32
          description: The number of workers that, in a specific day and location, were allocated to the task template and their task contribution status is NOT_STARTED or IN_PROGRESS
          examples:
            - 3
        priority:
          type: string
          description: The task template priority
          enum:
            - "1 - Ridicat"
            - "2 - Mediu"
            - "3 - Scazut"
        totalWorkload:
          type: number
          description: The total work volume for a specific day, location and task template
          examples:
            - 400
        completedWorkload:
          type: number
          description: The sum of the workload of the task contributions corresponding to the task template that have the status FINISHED
          examples:
            - 100
        inProgressWorkload:
          type: number
          description: The sum of the workload of the task contributions corresponding to the task template that have the status IN_PROGRESS
          examples:
            - 180
        remainingWorkload:
          type: number
          description: The remaining workload
          examples:
            - 120
        workloadMeasurementUnit:
          type: string
          examples:
            - elemente
        frequency:
          type: string
          description: The recommended task template frequency
          examples:
            - zilnic
        standardProductivity:
          type: string
          description: The reference for the speed a task should be performed with
          examples:
            - "100 elemente/ora"
    AddWorkVolume:
      type: object
      properties:
        taskTemplateId:
          type: integer
          format: int64
        workload:
          type: number
    UpdateWorkVolume:
      type: object
      properties:
        workload:
          type: number
    WorkVolumeReportList:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/WorkVolumeReport"
        page:
          $ref: "#/components/schemas/PagingMetadata"
    WorkVolumeReport:
      type: object
      properties:
        id:
          type: integer
          format: int64
        measurementUnit:
          type: string
        totalWorkload:
          type: number
        averageWorkload:
          type: number
    TaskCompletionReportList:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/TaskCompletionReport"
        page:
          $ref: "#/components/schemas/PagingMetadata"
    TaskCompletionReport:
      type: object
      properties:
        id:
          type: integer
          format: int64
        dayNumber:
          type: integer
        totalNumberOfTasks:
          type: integer
        finishedNumberOfTasks:
          type: integer
    LocationList:
      type: array
      items:
        $ref: "#/components/schemas/Location"
    Location:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    DepartmentList:
      type: array
      items:
        $ref: "#/components/schemas/Department"
    Department:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
    LocationCategoryList:
      type: array
      items:
        $ref: "#/components/schemas/LocationCategory"
    LocationCategory:
      type: object
      properties:
        id:
          type: integer
        category:
          type: string
        description:
          type: string
    PagingMetadata:
      type: object
      properties:
        pageSize:
          type: integer
          default: 10
          description: Size of the page
        page:
          type: integer
          default: 0
          description: The page number we are on
        totalCount:
          type: integer
          format: int64
          description: The total number of records
        pageCount:
          type: integer
          description: The total number of pages
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ErrorDTO"
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ErrorDTO"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ErrorDTO"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ErrorDTO"
    InternalServerError:
      description: An unexpected error happened
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ErrorDTO"
